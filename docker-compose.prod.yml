# Production: full stack (db + api + web) for a single VPS.
# Configure all URLs/secrets via environment variables (see .env.example).
# Put an HTTPS reverse proxy (Caddy, Nginx, Traefik) in front of this stack.
services:
  db:
    image: postgres:16-alpine
    container_name: crm-wsp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-wsp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crm}
      # WhatsApp / YCloud (configured by code/env, NOT from the UI):
      YCLOUD_API_KEY: ${YCLOUD_API_KEY}
      YCLOUD_WEBHOOK_SECRET: ${YCLOUD_WEBHOOK_SECRET}
      YCLOUD_WHATSAPP_NUMBER: ${YCLOUD_WHATSAPP_NUMBER}
      # AI model fallback (the real config is set from the UI):
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "3001:3001"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    container_name: crm-wsp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  crm_pgdata:
